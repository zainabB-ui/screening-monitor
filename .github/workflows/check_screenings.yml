name: Check Advance Screenings DC page

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: screening-monitor-check
  cancel-in-progress: false

permissions: write-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run monitor script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python monitor.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_screenshot.png
            debug_page.html
            debug_tables.json
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "screenings-bot"
          git config user.email "actions@github.com"

          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi

          git add state.json
          git commit -m "Update snapshot [skip ci]"

          n=0
          max_attempts=5
          until [ "$n" -ge "$max_attempts" ]
          do
            if git pull --rebase origin main && git push; then
              echo "Push succeeded."
              break
            fi
            n=$((n + 1))
            if [ "$n" -ge "$max_attempts" ]; then
              echo "Push failed after $max_attempts attempts."
              exit 1
            fi
            wait_time=$((RANDOM % 10 + 5))
            echo "Push failed, retrying in ${wait_time}s (attempt $n/$max_attempts)..."
            sleep "$wait_time"
          done

name: Check Advance Screenings DC page

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay slightly during high load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "screenings-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git add state.txt
            git commit -m "Update snapshot [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi

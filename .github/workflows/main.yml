name: Check Advance Screenings DC page

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay slightly during high load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Run monitor script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python monitor.py

      # Uploads a screenshot + raw HTML of what Playwright actually saw,
      # so you can open them and check whether it captured real listings,
      # a placeholder message, or a bot-blocked page. Available for 7 days
      # under the "Summary" tab of each workflow run.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            debug_screenshot.png
            debug_page.html
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "screenings-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git add state.txt
            git commit -m "Update snapshot [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
